<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turmas 7º A e 7º B - Sistema de Frequência 3D</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        
        /* BOTÃO FLUTUANTE DE MOSTRAR/ESCONDER INTERFACE */
        #btn-toggle-ui {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 300;
            background: rgba(15, 20, 25, 0.85);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 22px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            user-select: none;
        }
        #btn-toggle-ui:active { transform: scale(0.9); }

        .ui-hidden { display: none !important; }

        /* Etiquetas de Nome dos Alunos */
        .name-label-container {
            pointer-events: none;
            user-select: none;
        }

        .name-label {
            color: #ffffff;
            font-weight: bold;
            padding: 6px 12px;
            background: rgba(15, 20, 25, 0.88);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            font-size: 15px;
            backdrop-filter: blur(4px);
            box-shadow: 0px 4px 12px rgba(0,0,0,0.5);
            display: inline-block;
            white-space: nowrap;
            transform-origin: center bottom; 
            transition: background 0.3s, border-color 0.3s;
        }

        /* Etiqueta Especial do Professor */
        .teacher-label {
            background: rgba(13, 110, 253, 0.95) !important;
            border-color: #79dfc1 !important;
            font-size: 16px !important;
            padding: 8px 16px !important;
            box-shadow: 0px 6px 15px rgba(0,0,0,0.6) !important;
        }

        /* Aluno Faltoso (Vermelho) */
        .name-label.absent {
            background: rgba(220, 53, 69, 0.95) !important;
            border-color: #ff8888 !important;
            color: #fff !important;
        }

        /* Topbar de Controle (Turma + Data + Trava) */
        #top-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.98);
            padding: 8px 18px;
            border-radius: 35px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }

        #top-bar label {
            font-weight: bold;
            font-size: 14px;
            color: #222;
        }

        #class-select, #date-picker {
            padding: 6px 12px;
            border-radius: 18px;
            border: 2px solid #bbb;
            font-weight: bold;
            font-size: 14px;
            outline: none;
            background: #fdfdfd;
            cursor: pointer;
        }

        /* BOTÃO DESLIZANTE DE BLOQUEIO */
        .lock-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f0f4f8;
            padding: 4px 12px;
            border-radius: 25px;
            border: 1px solid #d0d7de;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #28a745;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        input:checked + .slider { background-color: #dc3545; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        /* Painel Inferior */
        #ui-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.98);
            padding: 10px 16px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
            max-width: 92vw;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            user-select: none;
        }

        .btn:active { transform: scale(0.94); }
        .btn-mode { background: #e9ecef; color: #333; }
        .btn-mode.active { background: #28a745; color: white; border: 2px solid #1e7e34; }
        .btn-action { background: #007bff; color: white; }
        .btn-save { background: #198754; color: white; }
        .btn-report { background: #6f42c1; color: white; }

        /* Modal do Relatório */
        #report-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 400;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            border-radius: 20px;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .close-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px; height: 36px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            font-size: 15px;
            border-bottom: 1px solid #ddd;
        }

        th { background: #f8f9fa; font-size: 16px; }

        #hint {
            position: absolute;
            top: 75px;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 4px black;
            font-size: 14px;
            pointer-events: none;
            z-index: 90;
        }
    </style>

    <!-- SDKs do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

    </script>
</head>
<body>
    <button id="btn-toggle-ui" title="Ocultar/Exibir Controles">👁️</button>

    <div id="top-bar">
        <label for="class-select">🏫 Turma:</label>
        <select id="class-select">
            <option value="7A">7º Ano A</option>
            <option value="7B" selected>7º Ano B</option>
        </select>

        <label for="date-picker">📅 Data:</label>
        <input type="date" id="date-picker">

        <div class="lock-container">
            <span id="lock-label" style="font-weight:bold; font-size: 13px; color:#dc3545;">🔒 Travar</span>
            <label class="switch">
                <input type="checkbox" id="lock-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div id="hint">🔒 Modo Apresentação: Girar e navegar liberados. Edição bloqueada.</div>

    <div id="ui-panel">
        <button id="btn-camera" class="btn btn-mode active">👁️ Girar Sala</button>
        <button id="btn-move" class="btn btn-mode btn-edit">🤚 Mover Alunos</button>
        <button id="btn-fit" class="btn btn-action">📐 Centralizar</button>
        <button id="btn-save" class="btn btn-save btn-edit">💾 Salvar Chamada</button>
        <button id="btn-report" class="btn btn-report">📊 Relatório Mensal</button>
    </div>

    <div id="report-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="report-title" style="margin:0; font-size: 18px;">📊 Relatório Mensal de Faltas</h2>
                <button class="close-btn" id="btn-close-modal">✕</button>
            </div>
            <div>
                <label style="font-weight: bold; font-size: 15px;">Mês: </label>
                <input type="month" id="report-month" style="padding:8px; border-radius:10px; border:1px solid #ccc; font-size: 15px; font-weight: bold;">
            </div>
            <table id="report-table">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Total de Faltas</th>
                    </tr>
                </thead>
                <tbody id="report-body"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // 1. DADOS DAS TURMAS
        const turmasData = {
            "7A": [
                "Ana Vitória", "Anne Caroline", "Anny Beatriz", "Caio Almeida", "Ellen Lavigne",
                "Fernando Juan", "Francisco Davi", "Geovana Cruz", "Isis Vitória", "Israel Elias",
                "Jhonatas Mouta", "João Lucas", "Lara Xavier", "Luana Moura", "Maria Clara",
                "Maria Grazyelle", "Maria Heloyse", "Maria Isabelly", "Maria Julia",
                "Maria Mickaelly", "Moisés Cardoso", "Nadson Luís", "Nicolas Ravi", "Pedro Lucas",
                "Pedro Ykaro", "Phillip Denyel", "Ruan Keven", "Samuel Lucas",
                "Sophia Andriele", "Sophia Pereira"
            ],
            "7B": [
                "Alejandro", "Aryane", "Carlos", "Clara", "Eduardo", "Enzo", "Erick",
                "Francisco D.", "Francisco S.", "Hayla", "Isabelly", "Isabely", "João A.",
                "João F.", "João G.", "Jorge", "Kauan", "Larissa", "Laura", "Lincon",
                "Maria Glória", "Maria Giovanna", "Maria Hadassa", "Murilo", "Ricardo",
                "Samuel", "Yara"
            ]
        };

        // 2. FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAcUCicgWDDltYCud77lxlPwPU6YgTQIpg",
            authDomain: "chamada-sala-3d.firebaseapp.com",
            projectId: "chamada-sala-3d",
            storageBucket: "chamada-sala-3d.firebasestorage.app",
            messagingSenderId: "1017275951090",
            appId: "1:1017275951090:web:0814ea04cb2c3422b36d6b"
        };

        let db = null;
        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "SUA_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            }
        } catch(e) { 
            console.warn("Usando armazenamento LocalStorage.", e); 
        }

        // 3. CENA E ILUMINAÇÃO (MELHORADOS)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdce5ec);
        scene.fog = new THREE.Fog(0xdce5ec, 20, 80); // Adiciona um leve fog para profundidade

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 25);

        // Renderizador com Mapeamento de Cores Realista (PBR)
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Sombras mais suaves
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Cores estilo cinema/jogos
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // Luzes mais naturais
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.position.set(15, 25, 10);
        sunLight.castShadow = true;
        // Alta resolução e alcance amplo para sombras cobrirem toda a sala
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 100;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // CHÃO (Agora com aspecto de porcelanato ou piso polido)
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0xcccccc, 
            roughness: 0.2, // Reflexivo
            metalness: 0.1 
        });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // PAREDES (Para fechar o ambiente)
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.9 });
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(80, 20, 1), wallMat);
        backWall.position.set(0, 10, -15);
        backWall.receiveShadow = true;
        scene.add(backWall);

        // QUADRO BRANCO (Detalhado)
        const boardFrame = new THREE.Mesh(new THREE.BoxGeometry(18, 6, 0.4), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.5 }));
        boardFrame.position.set(0, 6.5, -14.4);
        boardFrame.castShadow = true;
        scene.add(boardFrame);

        const boardSurface = new THREE.Mesh(new THREE.BoxGeometry(17.6, 5.6, 0.45), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }));
        boardSurface.position.set(0, 6.5, -14.4);
        scene.add(boardSurface);

        const boardDiv = document.createElement('div');
        boardDiv.style.cssText = 'color:#111; font-size:24px; font-weight:bold; font-family:sans-serif; text-shadow: 0px 1px 3px rgba(0,0,0,0.1);';
        const boardLabel = new CSS2DObject(boardDiv);
        boardLabel.position.set(0, 6.5, -14.1);
        scene.add(boardLabel);

        // PROFESSOR (Corpo com formas orgânicas)
        const teacher = new THREE.Group();
        
        // Mesa do Professor
        const tDeskTop = new THREE.Mesh(new THREE.BoxGeometry(4, 0.2, 2), new THREE.MeshStandardMaterial({ color: 0x5a3a22, roughness: 0.7 }));
        tDeskTop.position.set(0, 2.8, 2);
        tDeskTop.castShadow = true;
        teacher.add(tDeskTop);
        const tDeskBase = new THREE.Mesh(new THREE.BoxGeometry(3.8, 2.8, 1.8), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        tDeskBase.position.set(0, 1.4, 2);
        tDeskBase.castShadow = true;
        teacher.add(tDeskBase);

        // Corpo
        const tTorso = new THREE.Mesh(new THREE.CapsuleGeometry(0.6, 1.5, 4, 16), new THREE.MeshStandardMaterial({ color: 0x0d6efd, roughness: 0.6 }));
        tTorso.position.set(0, 2.2, 0);
        tTorso.castShadow = true;
        teacher.add(tTorso);
        const tHead = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 32), new THREE.MeshStandardMaterial({ color: 0xe0ac69, roughness: 0.4 }));
        tHead.position.set(0, 3.8, 0);
        tHead.castShadow = true;
        teacher.add(tHead);
        
        const teacherDiv = document.createElement('div');
        teacherDiv.className = 'name-label teacher-label';
        teacherDiv.textContent = 'Professor de Matemática';
        const teacherLabel = new CSS2DObject(teacherDiv);
        teacherLabel.position.set(0, 4.8, 0);
        teacher.add(teacherLabel);
        
        teacher.position.set(0, 0, -11.5);
        scene.add(teacher);

        // ANEL DE SELEÇÃO
        const ringGeo = new THREE.RingGeometry(1.5, 1.8, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x39ff14, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const selectionRing = new THREE.Mesh(ringGeo, ringMat);
        selectionRing.rotation.x = -Math.PI / 2;
        selectionRing.position.y = 0.05;
        selectionRing.visible = false;
        scene.add(selectionRing);

        // 4. LÓGICA DE GERENCIAMENTO DOS ALUNOS
        const alunosMap = new Map();
        const objetosArrastaveis = [];

        function criarConjunto(nome, posX, posZ) {
            const conjuntoGroup = new THREE.Group(); 
            
            // Mesa Detalhada (Tampo de madeira e pés de metal)
            const deskMat = new THREE.MeshStandardMaterial({ color: 0x9c6f44, roughness: 0.8 }); // Madeira
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.2 }); // Metal
            
            const deskTop = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.1, 1.4), deskMat);
            deskTop.position.set(0, 1.8, 0);
            deskTop.castShadow = true;
            deskTop.receiveShadow = true;
            conjuntoGroup.add(deskTop);
            
            // Pés da mesa
            const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.8);
            const leg1 = new THREE.Mesh(legGeo, metalMat); leg1.position.set(-1.1, 0.9, -0.6); leg1.castShadow = true;
            const leg2 = new THREE.Mesh(legGeo, metalMat); leg2.position.set(1.1, 0.9, -0.6); leg2.castShadow = true;
            const leg3 = new THREE.Mesh(legGeo, metalMat); leg3.position.set(-1.1, 0.9, 0.6); leg3.castShadow = true;
            const leg4 = new THREE.Mesh(legGeo, metalMat); leg4.position.set(1.1, 0.9, 0.6); leg4.castShadow = true;
            conjuntoGroup.add(leg1, leg2, leg3, leg4);

            // Cadeira Simples
            const chairMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b });
            const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 1.2), chairMat);
            chairSeat.position.set(0, 1.0, 1.2);
            chairSeat.castShadow = true;
            conjuntoGroup.add(chairSeat);

            // Aluno (Cápsula + Esfera para visual mais orgânico)
            const originalColor = new THREE.Color().setHSL(Math.random(), 0.6, 0.4);
            const roupaMat = new THREE.MeshStandardMaterial({ color: originalColor, roughness: 0.7 });
            
            // Tronco agora é uma cápsula (corpo)
            const tronco = new THREE.Mesh(new THREE.CapsuleGeometry(0.45, 0.8, 4, 16), roupaMat);
            tronco.position.set(0, 1.5, 1.2);
            tronco.castShadow = true;
            conjuntoGroup.add(tronco);

            // Cabeça agora é uma esfera
            const cabeca = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), new THREE.MeshStandardMaterial({color: 0xffccaa, roughness: 0.5}));
            cabeca.position.set(0, 2.5, 1.2);
            cabeca.castShadow = true;
            conjuntoGroup.add(cabeca);

            // Rótulo HTML
            const containerDiv = document.createElement('div');
            containerDiv.className = 'name-label-container';
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'name-label';
            nameDiv.textContent = nome;
            containerDiv.appendChild(nameDiv);

            const nameLabel = new CSS2DObject(containerDiv);
            nameLabel.position.set(0, 3.3, 1.2);
            conjuntoGroup.add(nameLabel);

            // Hitbox (invisível para facilitar clique)
            const hitbox = new THREE.Mesh(new THREE.BoxGeometry(3.0, 4, 3.0), new THREE.MeshBasicMaterial({ visible: false }));
            hitbox.position.set(0, 2, 0.5);
            conjuntoGroup.add(hitbox);

            conjuntoGroup.position.set(posX, 0, posZ);
            scene.add(conjuntoGroup);

            // Salva referências essenciais para o resto do código funcionar sem alterações
            conjuntoGroup.userData = {
                nome: nome,
                isAbsent: false,
                originalColor: originalColor,
                troncoMesh: tronco, // O script original altera a cor disso
                nameDiv: nameDiv    // O script original adiciona classe CSS nisso
            };

            objetosArrastaveis.push(conjuntoGroup);
            alunosMap.set(nome, conjuntoGroup);
        }

        const classSelect = document.getElementById('class-select');
        const datePicker = document.getElementById('date-picker');

        function carregarTurma(turmaKey) {
            objetosArrastaveis.forEach(group => {
                group.traverse(child => {
                    if (child.isCSS2DObject && child.element && child.element.parentNode) {
                        child.element.parentNode.removeChild(child.element);
                    }
                });
                scene.remove(group);
            });
            objetosArrastaveis.length = 0;
            alunosMap.clear();

            const nomeTurmaTexto = turmaKey === '7A' ? '7º ANO A' : '7º ANO B';
            boardDiv.textContent = `MATEMÁTICA - ${nomeTurmaTexto}`;

            const listaAlunos = turmasData[turmaKey] || [];
            const colunas = 5;
            const espacoX = 5.5;
            const espacoZ = 4.5;
            const inicioX = -((colunas - 1) * espacoX) / 2;
            const inicioZ = -7;

            listaAlunos.forEach((nome, index) => {
                const linha = Math.floor(index / colunas);
                const coluna = index % colunas;
                criarConjunto(nome, inicioX + (coluna * espacoX), inicioZ + (linha * espacoZ));
            });

            carregarChamada(datePicker.value, turmaKey);
        }

        // 5. MARCAR FALTA (Intacto)
        function toggleAbsence(alunoGroup) {
            const data = alunoGroup.userData;
            data.isAbsent = !data.isAbsent;

            if (data.isAbsent) {
                data.troncoMesh.material.color.setHex(0xdc3545);
                data.nameDiv.classList.add('absent');
            } else {
                data.troncoMesh.material.color.copy(data.originalColor);
                data.nameDiv.classList.remove('absent');
            }
        }

        // 6. CONTROLES DA CÂMERA E TRAVA (Intacto)
        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.maxPolarAngle = Math.PI / 2 - 0.05; // Impede a câmera de ir para baixo do chão
        orbitControls.minDistance = 5;
        orbitControls.maxDistance = 50;

        let currentMode = 'camera';
        let selectedAluno = null;
        let isDragging = false;
        let lastTapTime = 0;
        let lastTappedObj = null;

        const lockToggle = document.getElementById('lock-toggle');
        const lockLabel = document.getElementById('lock-label');
        const btnMove = document.getElementById('btn-move');
        const btnCamera = document.getElementById('btn-camera');
        const btnFit = document.getElementById('btn-fit');
        const hint = document.getElementById('hint');
        const editButtons = document.querySelectorAll('.btn-edit');

        // BOTÃO FLUTUANTE ESCONDER/EXIBIR
        const btnToggleUi = document.getElementById('btn-toggle-ui');
        const topBar = document.getElementById('top-bar');
        const uiPanel = document.getElementById('ui-panel');
        let uiVisible = true;

        btnToggleUi.addEventListener('click', () => {
            uiVisible = !uiVisible;
            if (uiVisible) {
                topBar.classList.remove('ui-hidden');
                uiPanel.classList.remove('ui-hidden');
                hint.classList.remove('ui-hidden');
                btnToggleUi.textContent = '👁️';
            } else {
                topBar.classList.add('ui-hidden');
                uiPanel.classList.add('ui-hidden');
                hint.classList.add('ui-hidden');
                btnToggleUi.textContent = '🙈';
            }
        });

        function setLockState(isLocked) {
            if (isLocked) {
                lockLabel.textContent = "🔒 Travar";
                lockLabel.style.color = "#dc3545";
                editButtons.forEach(btn => btn.style.display = 'none');
                currentMode = 'camera';
                btnCamera.classList.add('active');
                btnMove.classList.remove('active');
                orbitControls.enabled = true;
                deselect();
                hint.textContent = "🔒 Modo Apresentação: Girar e navegar liberados. Edição bloqueada.";
            } else {
                lockLabel.textContent = "🔓 Liberado";
                lockLabel.style.color = "#28a745";
                editButtons.forEach(btn => btn.style.display = 'inline-block');
                hint.textContent = "🔓 Modo Edição: Escolha Girar ou Mover Alunos. Duplo toque marca falta.";
            }
        }

        lockToggle.addEventListener('change', (e) => setLockState(e.target.checked));

        btnCamera.addEventListener('click', () => {
            currentMode = 'camera';
            btnCamera.classList.add('active');
            btnMove.classList.remove('active');
            orbitControls.enabled = true;
            deselect();
        });

        btnMove.addEventListener('click', () => {
            currentMode = 'move';
            btnMove.classList.add('active');
            btnCamera.classList.remove('active');
            orbitControls.enabled = false;
        });

        btnFit.addEventListener('click', () => {
            camera.position.set(0, 15, 25);
            orbitControls.target.set(0, 0, 0);
            orbitControls.update();
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const planeIntersect = new THREE.Vector3();

        function deselect() {
            if (selectedAluno) {
                selectedAluno.position.y = 0;
                selectedAluno = null;
            }
            selectionRing.visible = false;
            isDragging = false;
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#ui-panel') || e.target.closest('#top-bar') || e.target.closest('#report-modal') || e.target.closest('#btn-toggle-ui')) return;
            if (lockToggle.checked) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(objetosArrastaveis, true);
            
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while(obj.parent && !objetosArrastaveis.includes(obj)) obj = obj.parent;
                
                const currentTime = Date.now();
                if (currentTime - lastTapTime < 300 && lastTappedObj === obj) {
                    toggleAbsence(obj);
                    deselect();
                    lastTapTime = 0;
                    return;
                }

                lastTapTime = currentTime;
                lastTappedObj = obj;

                if (currentMode === 'move') {
                    selectedAluno = obj;
                    isDragging = true;
                    selectedAluno.position.y = 0.6;
                    selectionRing.visible = true;
                    selectionRing.position.set(selectedAluno.position.x, 0.05, selectedAluno.position.z);
                }
            } else {
                if (currentMode === 'move') deselect();
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (lockToggle.checked || currentMode !== 'move' || !isDragging || !selectedAluno) return;
            
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                selectedAluno.position.x = planeIntersect.x;
                selectedAluno.position.z = planeIntersect.z;
                selectionRing.position.x = planeIntersect.x;
                selectionRing.position.z = planeIntersect.z;
            }
        });

        window.addEventListener('pointerup', () => {
            if (selectedAluno && isDragging) {
                selectedAluno.position.y = 0;
                isDragging = false;
            }
        });

        // 7. PERSISTÊNCIA DE DADOS (Intacto)
        datePicker.value = new Date().toISOString().split('T')[0];

        async function salvarChamada() {
            if (lockToggle.checked) return;

            const turmaKey = classSelect.value;
            const dataStr = datePicker.value;
            if (!dataStr) return alert("Selecione uma data válida!");

            const docId = `${turmaKey}_${dataStr}`;
            const absentList = [];
            const layoutData = {};

            alunosMap.forEach((alunoGroup, nome) => {
                if (alunoGroup.userData.isAbsent) {
                    absentList.push(nome);
                }
                layoutData[nome] = {
                    x: alunoGroup.position.x,
                    z: alunoGroup.position.z
                };
            });

            const registro = {
                turma: turmaKey,
                date: dataStr,
                absentStudents: absentList,
                layout: layoutData
            };

            const btnSave = document.getElementById('btn-save');
            btnSave.textContent = "Salvando...";

            try {
                if (db) {
                    await db.collection("chamadas").doc(docId).set(registro);
                } else {
                    localStorage.setItem(`chamada_${docId}`, JSON.stringify(registro));
                }
                alert(`✅ Chamada do ${turmaKey === '7A' ? '7º Ano A' : '7º Ano B'} (${dataStr}) salva!`);
            } catch (err) {
                alert("Erro ao salvar!");
                console.error(err);
            } finally {
                btnSave.textContent = "💾 Salvar Chamada";
            }
        }

        document.getElementById('btn-save').addEventListener('click', salvarChamada);

        async function carregarChamada(dataStr, turmaKey) {
            const docId = `${turmaKey}_${dataStr}`;
            let registro = null;

            if (db) {
                try {
                    const doc = await db.collection("chamadas").doc(docId).get();
                    if (doc.exists) registro = doc.data();
                } catch(e) {}
            } else {
                const local = localStorage.getItem(`chamada_${docId}`);
                if (local) registro = JSON.parse(local);
            }

            alunosMap.forEach(alunoGroup => {
                alunoGroup.userData.isAbsent = false;
                alunoGroup.userData.troncoMesh.material.color.copy(alunoGroup.userData.originalColor);
                alunoGroup.userData.nameDiv.classList.remove('absent');
            });

            if (registro) {
                if (registro.absentStudents) {
                    registro.absentStudents.forEach(nome => {
                        const aluno = alunosMap.get(nome);
                        if (aluno) {
                            aluno.userData.isAbsent = true;
                            aluno.userData.troncoMesh.material.color.setHex(0xdc3545);
                            aluno.userData.nameDiv.classList.add('absent');
                        }
                    });
                }
                if (registro.layout) {
                    Object.keys(registro.layout).forEach(nome => {
                        const aluno = alunosMap.get(nome);
                        if (aluno && registro.layout[nome]) {
                            aluno.position.x = registro.layout[nome].x;
                            aluno.position.z = registro.layout[nome].z;
                        }
                    });
                }
            }
        }

        datePicker.addEventListener('change', (e) => carregarChamada(e.target.value, classSelect.value));
        classSelect.addEventListener('change', (e) => carregarTurma(e.target.value));

        // 8. RELATÓRIO MENSAL POR TURMA (Intacto)
        const modal = document.getElementById('report-modal');
        const reportMonth = document.getElementById('report-month');
        const reportBody = document.getElementById('report-body');
        const reportTitle = document.getElementById('report-title');
        const btnReport = document.getElementById('btn-report');
        const btnCloseModal = document.getElementById('btn-close-modal');

        reportMonth.value = new Date().toISOString().slice(0, 7);

        async function gerarRelatorio() {
            const selectedMonth = reportMonth.value;
            const turmaKey = classSelect.value;
            const nomeTurma = turmaKey === '7A' ? '7º Ano A' : '7º Ano B';
            
            if (!selectedMonth) return;

            reportTitle.textContent = `📊 Faltas de ${selectedMonth} - ${nomeTurma}`;

            const totalFaltas = {};
            (turmasData[turmaKey] || []).forEach(nome => totalFaltas[nome] = 0);

            if (db) {
                const snapshot = await db.collection("chamadas").get();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.turma === turmaKey && data.date.startsWith(selectedMonth)) {
                        if (data.absentStudents) {
                            data.absentStudents.forEach(nome => {
                                if (totalFaltas[nome] !== undefined) totalFaltas[nome]++;
                            });
                        }
                    }
                });
            } else {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith(`chamada_${turmaKey}_${selectedMonth}`)) {
                        const registro = JSON.parse(localStorage.getItem(key));
                        if (registro.absentStudents) {
                            registro.absentStudents.forEach(nome => {
                                if (totalFaltas[nome] !== undefined) totalFaltas[nome]++;
                            });
                        }
                    }
                }
            }

            reportBody.innerHTML = '';
            const alunosOrdenados = Object.keys(totalFaltas).sort((a,b) => totalFaltas[b] - totalFaltas[a]);

            alunosOrdenados.forEach(nome => {
                const tr = document.createElement('tr');
                const faltas = totalFaltas[nome];
                tr.innerHTML = `
                    <td><b>${nome}</b></td>
                    <td><span style="color: ${faltas > 0 ? '#dc3545' : '#28a745'}; font-weight: bold;">${faltas}</span></td>
                `;
                reportBody.appendChild(tr);
            });
        }

        btnReport.addEventListener('click', () => {
            modal.style.display = 'flex';
            gerarRelatorio();
        });

        btnCloseModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        reportMonth.addEventListener('change', gerarRelatorio);

        // 9. RENDER LOOP
        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // INICIALIZAÇÃO
        setLockState(true); // Começa travado
        carregarTurma('7B'); // Carrega a turma inicial
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
